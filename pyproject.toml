[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toeknife"
version = "2.0.0"
description = "Forensic carver and bit-level inspector for DEFLATE streams and fragments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "XlogicX" }]
keywords = ["deflate", "forensics", "zlib", "gzip", "lz77", "huffman", "carving"]
dependencies = ["textual>=0.79"]

[project.optional-dependencies]
ml = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
toeknife = "toeknife.cli:main"

[project.urls]
Homepage = "https://github.com/XlogicX/ToeKnife"

[tool.hatch.build.targets.wheel]
packages = ["toeknife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
